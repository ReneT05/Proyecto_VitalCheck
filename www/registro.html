<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Viatlcheck - Registrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>
    <main class="page-shell">
        <header class="page-header compact">
            <a class="back-link" href="inicio.html"><i class="fas fa-arrow-left"></i> Inicio</a>
            <div>
                <span class="brand-pill secondary">Registrar</span>
                <h1 id="formTitle">Registrar valores</h1>
                <p id="formDescription">Selecciona el tipo de registro y completa los datos con campos grandes.</p>
            </div>
        </header>

        <section class="form-card">
            <div class="status-banner green" id="statusBanner">
                <div>
                    <strong id="statusTitle">Listo para registrar</strong>
                    <p id="statusText">Usa el botón para escoger azúcar o presión.</p>
                </div>
                <div class="status-icon"><i class="fas fa-eye"></i></div>
            </div>

            <form id="dataForm">
                <div class="field-group">
                    <label class="field-label">Tipo de registro</label>
                    <div class="type-pill-group">
                        <button type="button" data-type="sugar" class="type-pill active" id="sugarType">Azúcar</button>
                        <button type="button" data-type="pressure" class="type-pill" id="pressureType">Presión</button>
                    </div>
                </div>

                <div id="sugarFields" class="fields-section">
                    <div class="field-group">
                        <label class="field-label" for="glucoseValue">Glucosa en sangre (mg/dL)</label>
                        <input id="glucoseValue" type="number" min="20" max="500" inputmode="numeric" placeholder="Ej. 98" class="field-input" required>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Momento</label>
                        <div class="radio-row">
                            <label class="radio-label"><input type="radio" name="meal" value="ayunas" checked> Ayunas</label>
                            <label class="radio-label"><input type="radio" name="meal" value="despues"> Después de comer</label>
                        </div>
                    </div>
                </div>

                <div id="pressureFields" class="fields-section hidden">
                    <div class="field-group horizontal-group">
                        <div>
                            <label class="field-label" for="systolicValue">Sistólica</label>
                            <input id="systolicValue" type="number" min="60" max="220" inputmode="numeric" placeholder="120" class="field-input">
                        </div>
                        <div>
                            <label class="field-label" for="diastolicValue">Diastólica</label>
                            <input id="diastolicValue" type="number" min="40" max="140" inputmode="numeric" placeholder="80" class="field-input">
                        </div>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="pulseValue">Pulso</label>
                        <input id="pulseValue" type="number" min="30" max="180" inputmode="numeric" placeholder="72" class="field-input">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary-action" id="submitButton"><i class="fas fa-check-circle"></i> Guardar registro</button>
                </div>
            </form>
        </section>

        <section class="summary-block">
            <div class="section-title"><span>Últimos registros</span></div>
            <div id="lastSummary" class="summary-list">No hay registros guardados todavía.</div>
        </section>
    </main>

    <script src="cordova.js"></script>
    <script src="js/registro.js"></script>
</body>

</html>
