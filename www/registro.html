<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sistema de Ventas - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/form.css">
</head>

<body>

    <nav class="pos-nav">
        <div class="nav-container">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-cash-register"></i>
                </div>
                <div class="logo-text">
                    Sistema de Ventas
                </div>
            </div>
          
        </div>
    </nav>

    <main class="app-shell">
        <div class="card">
            <div class="card-header">
                <div class="brand-icon-wrapper">
                    <i class="fas fa-boxes"></i>
                </div>
                <h1>Registrar Producto</h1>
                <p>Introduce los datos para actualizar el inventario global.</p>
            </div>
            
            <div id="formMessage" class="form-message" aria-live="polite"></div>
            
            <form id="product-form" action="" method="post">
                <div class="mb-3">
                    <label for="codeqr" class="form-label"><i class="fas fa-qrcode me-1"></i> Código</label>
                    <input type="number" class="form-control" name="codeqr" id="codeqr" placeholder="xxxxxxxxxx" />
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label"><i class="fas fa-tag me-1"></i> Nombre</label>
                    <input type="text" class="form-control" name="name" id="name" placeholder="Ej. Refresco de Cola" />
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label"><i class="fas fa-align-left me-1"></i> Descripción</label>
                    <input type="text" class="form-control" name="description" id="description" placeholder="Detalles del producto" />
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label"><i class="fas fa-dollar-sign me-1"></i> Precio</label>
                    <input type="number" class="form-control" name="price" id="price" placeholder="0.00" step="0.01" />
                </div>
                <div class="mb-3">
                    <label for="quantity" class="form-label"><i class="fas fa-layer-group me-1"></i> Cantidad</label>
                    <input type="number" class="form-control" name="quantity" id="quantity" placeholder="0" />
                </div>
                <div class="form-actions">
                    <button type="button" id="vlvr" name="vlvr" class="btn-secundario">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>
                    <button type="submit" id="submitButton" class="btn-primary-action">
                        <i class="fas fa-save"></i> Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/form.js"></script>
</body>

</html>
