<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Vitalcheck - Tendencias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/tendencias.css">
</head>

<body>
    <nav class="pos-nav">
        <div class="nav-container">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="logo-text">Vitalcheck</div>
            </div>
            <a href="inicio.html" class="nav-btn"><i class="fas fa-home"></i> Inicio</a>
        </div>
    </nav>

    <main class="app-shell">
        <div class="panel">
            <div class="panel-row row g-0">
                <div class="side-left col-12 col-xl-4 col-lg-5 order-lg-2 order-xl-2">
                    <div class="header-cart">
                        <div class="brand">
                            <i class="fas fa-chart-line me-2"></i>
                            <strong>Tendencias</strong>
                            <small>Resumen de tus mediciones</small>
                        </div>
                    </div>
                    <article class="summary-card">
                        <span>Última actualización</span>
                        <strong id="updated-at">Cargando...</strong>
                    </article>
                    <a href="historial.html" class="btn-primary-action" style="margin-top: 1rem;">Ver historial</a>
                </div>
                <aside class="side-right col-12 col-xl-8 col-lg-7 order-lg-1 order-xl-1">
                    <div class="section-title mb-3">
                        <i class="fas fa-wave-square me-2"></i> Indicadores
                    </div>
                    <div class="row g-3" id="summaryCards"></div>
                    <div class="mt-4">
                        <h5>Promedios recientes</h5>
                        <div class="row g-3" id="averageCards"></div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="js/tendencias.js"></script>
</body>

</html>
