<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">

<meta http-equiv="Content-Security-Policy"
content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval';
connect-src 'self' https://elrjtd.online;
style-src 'self' 'unsafe-inline';
media-src *;">    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">

    <link rel="stylesheet" href="css/escaner.css">

    <title>Escáner</title>
</head>

<body>

    <main class="modulo-escaner">

        <section class="panel-control">
            <h3>Módulo de Captura</h3>

            <div class="acciones-panel">
                <a href="form.html" class="btn-secundario">Añadir producto</a>
            </div>


             <div id="container">
                <div id="barkoderView"></div>
                <div class="btnContainer">
                    <button id="startScanBtn" class="actionButton" disabled>Start Scanning</button>
                    <button id="stopScanBtn" class="actionButton" disabled>Stop Scanning</button>
                </div>
                <div id="resultContainer" class="resultContainer" style="display:none;">
                    <p>Result: <a id="resultText"></a></p>
                    <p>Type: <span id="resultType"></span></p>
                    <img id="resultImage" class="resultImage" alt="Scanned Thumbnail" />
                </div>
            </div>
        </section>

        <section class="seccion-crud">

            <div class="formulario-mock">
                <h4>Captura manual</h4>

                <div class="grupo-input">
                    <input type="text" id="input-codigo-manual" placeholder="Código de barras manual">
                    <button id="btnGuardar">Guardar</button>
                </div>

                <p id="mensaje-sistema" class="mensaje-sistema"></p>
            </div>

            <div class="historial-escaneos">
                <h4>imagen</h4>
                  <img src="img/escanerIMG.jpg" alt="Imagen del escáner">
                <ul id="lista-codigos" class="lista-datos"></ul>
            </div>

        </section>

        


            <script src="cordova.js"></script>
            <script src="js/config.js"></script>
            <script src="js/escaner.js"></script>

            <a href="ventas.html" class="btn-secundario">Volver al menú</a>
</body>
</section>
</main>

</html>
