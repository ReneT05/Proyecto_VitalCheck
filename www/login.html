<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VitalCheck - Inicio de sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <main class="login-shell">
        <section class="login-card">
            <div class="brand-top">
                <span class="brand-pill">VitalCheck</span>
                <h1>Bienvenido</h1>
                <p>Ingresa tu PIN para acceder a los registros de salud y al módulo protegido.</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="field-group">
                    <label class="field-label" for="usernameInput">Usuario</label>
                    <input id="usernameInput" type="text" autocomplete="username" placeholder="Usuario" class="field-input">
                </div>
                <div class="field-group">
                    <label class="field-label" for="passwordInput">Contraseña</label>
                    <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Contraseña" class="field-input">
                </div>
                <div class="field-divider">o</div>
                <div class="field-group">
                    <label class="field-label" for="pinInput">PIN de acceso</label>
                    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="8" placeholder="****" class="field-input">
                </div>
                <p id="loginError" class="login-error"></p>
                <button type="submit" class="btn-primary-action"><i class="fas fa-sign-in-alt"></i> Iniciar sesión</button>
            </form>

            <div class="login-note">
                <p>Usuario de ejemplo: <strong>admin</strong></p>
                <p>Contraseña de ejemplo: <strong>admin123</strong></p>
                <p>PIN de emergencia: <strong>1234</strong></p>
            </div>
        </section>
    </main>

    <script src="cordova.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
