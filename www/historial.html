<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Viatlcheck - Historial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/historial.css">
    <link rel="stylesheet" href="css/layout.css">
</head>

<body>
    <main class="page-shell app-layout" id="appShell">
        <section class="content">
        <header class="page-header compact">
            <a class="back-link" href="inicio.html"><i class="fas fa-arrow-left"></i> Inicio</a>
            <div>
                <span class="brand-pill">Historial</span>
                <h1>Registros recientes</h1>
                <p>Lista ordenada por fecha y hora, con iconos de ayunas o después de comer.</p>
            </div>
        </header>

        <section class="search-card">
            <label class="field-label" for="recordSearch">Buscar registro</label>
            <input id="recordSearch" type="search" class="field-input" placeholder="Buscar por tipo, valor o fecha">
        </section>

        <section class="history-block">
            <div id="historyList" class="history-list"></div>
        </section>
        </section>
    </main>

    <script src="cordova.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/historial.js"></script>
</body>

</html>
