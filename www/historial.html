<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/historial.css">
    <title>Vitalcheck - Historial</title>
</head>
<body>
    <main class="app-shell">
        <div class="panel">
            <div class="panel-row row g-0">
                <div class="side-left col-12 col-xl-4 col-lg-5 order-lg-2 order-xl-2">
                    <div class="header-cart">
                        <div class="brand">
                            <i class="fas fa-history me-2"></i>
                            <strong>Historial</strong>
                            <small>Registros recientes</small>
                        </div>
                    </div>

                    <article class="summary-card">
                        <span>Total de registros</span>
                        <strong id="total-count">0</strong>
                    </article>

                    <a href="inicio.html" class="btn-primary-action" style="margin-top: 1rem;">
                        <i class="fas fa-home me-2"></i>Volver al inicio
                    </a>
                </div>

                <aside class="side-right col-12 col-xl-8 col-lg-7 order-lg-1 order-xl-1">
                    <div class="section-title mb-3">
                        <i class="fas fa-table me-2"></i>Historial de mediciones
                    </div>

                    <div class="mb-3">
                        <label for="inventorySearchInput" class="form-label visually-hidden">Buscar historial</label>
                        <input id="inventorySearchInput" type="search" class="form-control" placeholder="Buscar por tipo, estado o fecha">
                    </div>

                    <div class="inventory-table-wrapper">
                        <table class="inventory-table">
                            <thead>
                                <tr>
                                    <th>Tipo</th>
                                    <th>Medición</th>
                                    <th>Estado</th>
                                    <th>Observaciones</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-body">
                                <tr>
                                    <td colspan="5">Cargando historial...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="page-footer text-center py-4">
        <p>Última actualización: <span id="updated-at">21 de mayo de 2026</span></p>
    </footer>
    <script src="js/historial.js"></script>
</body>
</html>
